name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout dicom-viewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dicom-viewer
          persist-credentials: false

      - name: Checkout wsi-dicom-annotations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frames-sg/wsi-dicom-annotations
          ref: a623e84405d9be6779e7065a71031228b20849a5
          path: wsi-dicom-annotations
          persist-credentials: false

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@a75363d06101555fc97c6c7e1e65670b99104d98 # 1.96.1
        with:
          components: rustfmt, clippy

      - name: Format
        if: runner.os == 'Linux'
        working-directory: dicom-viewer
        run: cargo fmt --all -- --check

      - name: Verify locked dependency graph
        working-directory: dicom-viewer
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Clippy
        working-directory: dicom-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        working-directory: dicom-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --all-targets --locked

      - name: Check CUDA feature compilation
        if: runner.os == 'Linux'
        working-directory: dicom-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --locked --features cuda

      - name: Test default macOS Metal tile output
        if: runner.os == 'macOS'
        working-directory: dicom-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo test -p dicom-viewer-core --locked macos_metal_options_return_resident_tiles_for_synthetic_dicom_htj2k

      - name: Release build
        working-directory: dicom-viewer
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --workspace --release --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dicom-viewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dicom-viewer
          persist-credentials: false

      - name: Checkout wsi-dicom-annotations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frames-sg/wsi-dicom-annotations
          ref: a623e84405d9be6779e7065a71031228b20849a5
          path: wsi-dicom-annotations
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@a75363d06101555fc97c6c7e1e65670b99104d98 # 1.96.1

      - name: Install dependency tools
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.4 --locked

      - name: Audit RustSec advisories
        working-directory: dicom-viewer
        run: cargo audit --deny unsound

      - name: Enforce dependency policy
        working-directory: dicom-viewer
        run: cargo deny check advisories bans licenses sources
