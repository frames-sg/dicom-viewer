[package]
name = "dicom-viewer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
cuda = ["wsi-rs/cuda"]

[dependencies]
dicom-core = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-encoding = { workspace = true }
dicom-object = { workspace = true }
dicom-parser = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
wsi-rs = { workspace = true }
thiserror = { workspace = true }
lcms2 = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
j2k-metal-support = { workspace = true }
metal = { workspace = true }
wsi-rs = { workspace = true, features = ["metal"] }

[dev-dependencies]
j2k-native = { workspace = true }
tempfile = { workspace = true }
