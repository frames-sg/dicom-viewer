[workspace]
resolver = "2"
members = [
    "apps/dicom-viewer",
    "crates/dicom-viewer-core",
    "crates/metal-wgpu-interop",
]
exclude = ["vendor/epaint", "vendor/lru", "vendor/wayland-scanner"]

[workspace.package]
edition = "2021"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frames-sg/dicom-viewer"

[workspace.dependencies]
dicom-core = "0.9"
dicom-dictionary-std = "0.9"
dicom-object = "0.9"
eframe = { version = "0.34.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui-wgpu = "0.34.3"
wgpu = "29.0.3"
wgpu-hal = "29.0.3"
objc2 = "0.6.4"
objc2-metal = "0.3.2"
j2k-core = "0.12.0"
j2k-metal-support = "0.12.0"
j2k-native = "0.12.0"
pollster = "0.4"
rayon = "1"
rfd = "0.17.2"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
wsi-rs = "0.8.0"
tempfile = "3"
thiserror = "2"
tiff = "0.11.3"
lcms2 = { version = "6.1.1", features = ["static"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
geo = { version = "0.33.1", default-features = false }
rstar = "0.12.2"
wsi-dicom-annotations = "=0.1.4"

# Dependency patches and the Windows font backend; see SUPPLY_CHAIN.md.
# Security-patched crates retain their SECURITY-PATCH.md removal criteria.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
lru = { path = "vendor/lru" }
wayland-scanner = { path = "vendor/wayland-scanner" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
