[workspace]
resolver = "2"
members = [
    "apps/dicom-viewer",
    "crates/dicom-viewer-core",
    "crates/metal-wgpu-interop",
]
exclude = ["vendor/wayland-scanner"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frames-sg/dicom-viewer"

[workspace.dependencies]
dicom-core = "0.9"
dicom-dictionary-std = "0.9"
dicom-encoding = "0.9"
dicom-object = "0.9"
dicom-parser = "0.9"
dicom-transfer-syntax-registry = { version = "0.9", default-features = false }
eframe = { version = "0.34.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui-wgpu = "0.34.3"
wgpu = "29.0.3"
wgpu-hal = "29.0.3"
metal = "0.33"
objc2 = "0.6.4"
objc2-metal = "0.3.2"
foreign-types = "0.5"
j2k-core = "=0.8.0"
j2k-metal-support = "=0.8.0"
j2k-native = "=0.8.0"
pollster = "0.4"
rfd = "0.17.2"
serde_json = "1"
wsi-rs = "=0.5.2"
tempfile = "3"
thiserror = "2"
lcms2 = { version = "6.1.1", features = ["static"] }
sha2 = "0.10"

# Temporary security patch for RUSTSEC-2026-0194 and RUSTSEC-2026-0195.
# Remove this override after wayland-scanner publishes a release requiring
# quick-xml >= 0.41. See vendor/wayland-scanner/SECURITY-PATCH.md.
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
