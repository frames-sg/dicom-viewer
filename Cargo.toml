[workspace]
resolver = "2"
members = [
    "apps/dicom-viewer",
    "crates/dicom-viewer-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frames-sg/dicom-viewer"

[workspace.dependencies]
dicom-core = "0.9"
dicom-dictionary-std = "0.9"
dicom-object = "0.9"
eframe = { version = "0.34.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rfd = "0.17.2"
rayon = "1.12"
wsi-rs = { path = "../wsi-rs" }
j2k-test-support = { path = "../j2k/crates/j2k-test-support", features = [
    "j2k-native-fixtures",
] }
tempfile = "3"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
