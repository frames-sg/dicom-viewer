[package]
name = "dicom-viewer"
version = "0.1.0"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
cuda = ["dicom-viewer-core/cuda"]

[dependencies]
dicom-viewer-core = { version = "=0.1.1", path = "../../crates/dicom-viewer-core" }
wsi-dicom-annotations = { workspace = true }
eframe = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tiff = { workspace = true }
uuid = { workspace = true }
rstar = { workspace = true }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
j2k-metal-support = { workspace = true }
metal-wgpu-interop = { version = "=0.1.0", path = "../../crates/metal-wgpu-interop" }

[dev-dependencies]
dicom-core = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-object = { workspace = true }
j2k-native = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
metal-wgpu-interop = { version = "=0.1.0", path = "../../crates/metal-wgpu-interop", features = ["test-support"] }
